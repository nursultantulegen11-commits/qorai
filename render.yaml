services:
  - type: web
    name: qorai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: qorai-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
databases:
  - name: qorai-db
    databaseName: qorai
    user: qorai
    plan: free
    region: frankfurt
    ipAllowList: []
